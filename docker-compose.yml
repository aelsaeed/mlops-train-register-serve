version: "3.8"

services:
  mlflow:
    image: python:3.11-slim
    working_dir: /mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow:/mlflow
    command: >
      bash -c "pip install --no-cache-dir mlflow==2.12.1
      && mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000"
