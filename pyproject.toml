[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-train-register-serve"
version = "0.2.0"
description = "A reproducible train-to-serve MLOps reference workflow with MLflow and FastAPI"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{ name = "Ahmed El Saeed" }]
keywords = ["mlops", "mlflow", "model-registry", "fastapi", "model-serving"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115,<1",
  "mlflow>=3.15.1,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "prometheus-client>=0.21,<1",
  "scikit-learn>=1.4,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
mlops-train = "mlops_trs.cli:train_main"
mlops-register = "mlops_trs.cli:register_main"
mlops-promote = "mlops_trs.cli:promote_main"
mlops-serve = "mlops_trs.cli:serve_main"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx2>=2.12,<3",
  "mypy>=1.11,<3",
  "pip-audit>=2.7,<3",
  "pre-commit>=3.7,<5",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.7,<1",
]

[project.urls]
Homepage = "https://github.com/aelsaeed/mlops-train-register-serve"
Issues = "https://github.com/aelsaeed/mlops-train-register-serve/issues"
Repository = "https://github.com/aelsaeed/mlops-train-register-serve.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["^artifacts/", "^build/", "^dist/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["app", "mlops_trs"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
