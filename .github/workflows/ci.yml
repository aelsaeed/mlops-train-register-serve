name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install dependencies
        run: python -m pip install --constraint constraints.txt --editable ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Typecheck
        run: python -m mypy .

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install dependencies
        run: python -m pip install --constraint constraints.txt --editable ".[dev]"

      - name: Tests with coverage
        run: python -m pytest --cov --cov-report=term-missing

      - name: Tiny training run
        env:
          MLFLOW_TRACKING_URI: sqlite:////tmp/mlops-ci.db
          MLFLOW_ARTIFACT_LOCATION: file:///tmp/mlops-ci-artifacts
        run: >-
          mlops-train
          --dataset-path data/sample.csv
          --output /tmp/ci-train-output.json
          --model-output-dir /tmp/ci-models

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install build frontend
        run: python -m pip install --constraint constraints.txt build

      - name: Build wheel and source distribution
        run: python -m build

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install project and auditor
        run: >-
          python -m pip install
          --constraint constraints.txt
          --editable .
          pip-audit

      - name: Audit dependencies
        # Temporary upstream conflict: MLflow 3.15.1 requires cryptography<50,
        # while PYSEC-2026-3552 is fixed in cryptography 50.0.0.
        run: >-
          python -m pip_audit
          --skip-editable
          --ignore-vuln PYSEC-2026-3552

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [quality, tests]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install application
        run: python -m pip install --constraint constraints.txt --editable .

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build API image
        run: docker build --tag mlops-train-register-serve:local .

      - name: Verify non-root runtime
        run: |
          image_user="$(docker image inspect mlops-train-register-serve:local --format '{{.Config.User}}')"
          test -n "$image_user"
          test "$image_user" != "0"
          test "$image_user" != "root"

      - name: Smoke-test API image liveness
        run: |
          docker run --detach --name mlops-api-ci --publish 127.0.0.1:8000:8000 mlops-train-register-serve:local
          trap 'docker rm --force mlops-api-ci >/dev/null 2>&1 || true' EXIT
          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs mlops-api-ci
          exit 1

      - name: Run containerized lifecycle
        env:
          API_PORT: "18080"
          MLFLOW_PORT: "15000"
          PYTHON_BIN: python
          SKIP_API_BUILD: "1"
        run: bash scripts/e2e.sh
